[workspace]
resolver = "2"
members = [
    "crates/bbr-web",
    "crates/bbr-testkit",
    "crates/bbr-fixtures",
    "crates/bbr-web-macos",
    "crates/bbr-app",
    "crates/bbr-domain",
    "crates/bbr-browser",
    "crates/bbr-command",
    "crates/bbr-persistence",
    "crates/bbr-split",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# GPUI-CE pin: the pinned gpui-ce dependency tree's highest *declared*
# rust-version on macOS is 1.89 (`smol_str 0.3.6`); the Linux-target stack
# (oo7 via ashpd/zbus) declares 1.92. The previous 1.85 claim would be false
# under this pin. The dev shell provides 1.97.1, so the floor is a contract,
# not the tested toolchain. See docs/roadmap/tasks/gpui-ce-components-anchor.md.
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bbr-fixtures = { path = "crates/bbr-fixtures" }
bbr-testkit = { path = "crates/bbr-testkit" }
bbr-domain = { path = "crates/bbr-domain" }
bbr-web = { path = "crates/bbr-web" }
bbr-browser = { path = "crates/bbr-browser" }
bbr-command = { path = "crates/bbr-command" }
bbr-split = { path = "crates/bbr-split" }
bbr-web-macos = { path = "crates/bbr-web-macos" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# =0.38.0: newest rusqlite whose libsqlite3-sys (0.36) still compiles on the
# devshell stable toolchain; 0.40.1 pulls libsqlite3-sys 0.38.1 whose build
# script needs the unstable `cfg_select!` (E0658 on rustc 1.97.1).
rusqlite = { version = "=0.38.0", default-features = false, features = ["bundled"] }

# Small, single-thread-friendly channel used by the app's main-loop test
# gateway (commands/events are pumped through async channels on GPUI's
# foreground executor; the socket server thread blocks on per-request replies).
smol = "2"

# GPUI-CE at the exact upstream commit 568271c01c5a9d640d7b091e5bfd136b04035f28
# (haptic feedback, 2026-08-04). `default-features = false` drops the
# Linux/Windows compositor features; `font-kit` stays required for real text
# rendering on macOS (gpui_macos text system). `gpui_platform` provides the
# per-OS platform constructor that crates.io gpui 0.2.2 used to embed in
# `Application::new()`. `[patch.crates-io]` below redirects every crates.io
# `gpui` consumer (including `gpui-component`'s `gpui = "0.2.2"`) to this
# same Git source, so cargo resolves exactly one gpui type world.
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "568271c01c5a9d640d7b091e5bfd136b04035f28", default-features = false, features = ["font-kit"] }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "568271c01c5a9d640d7b091e5bfd136b04035f28", default-features = false, features = ["font-kit"] }
# gpui-component 0.5.1, pinned exactly. Its optional `webview` feature (Wry)
# stays disabled: BBR keeps its native WKWebViews and never replaces them.
# The source is vendored under vendor/gpui-component (see its BBR_PATCHES.md)
# because upstream 0.5.1 does not compile against the GPUI-CE pin; the vendored
# copy applies only mechanical API-compatibility deltas, no redesign.
gpui-component = { version = "=0.5.1", default-features = false }

# Native bridge crates (macOS only). Pinned to the versions verified against
# GPUI 0.2.2 / GPUI-CE's `raw-window-handle 0.6` / `objc2 0.6` stack in
# ARCHITECTURE.md. GPUI-CE itself uses the same objc2 0.6 / objc2-app-kit 0.3
# family, so the native bridge and the GPUI mac platform unify on one set.
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
block2 = { version = "0.6.2", default-features = false, features = ["alloc", "std"] } # reserved for a later phase (decision handlers)
raw-window-handle = "0.6"

objc2-foundation = { version = "0.3.2", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-web-kit = { version = "0.3.2", default-features = false }

# One gpui source/type world: crates.io `gpui` requirements (gpui-component
# and gpui-component-macros declare `gpui = "0.2.2"`) are patched to the
# exact GPUI-CE revision above, identical to the direct `gpui` dependency.
[patch.crates-io]
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "568271c01c5a9d640d7b091e5bfd136b04035f28" }
gpui-component = { path = "vendor/gpui-component" }