[package]
name = "bbr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "BBR browser — composition root (GPUI chrome + native WebKit engine)."

[[bin]]
name = "bbr"
path = "src/main.rs"

[features]
default = []
# Test-only instrumentation: the E2E testkit gateway, deterministic id
# generation, and CLI flags that seed them. NEVER enabled in release
# profiles — the gateway binds a local unix socket authenticated with a
# per-spawn token (see crates/bbr-testkit).
testkit = [
    "dep:bbr-testkit",
    "dep:mach2",
    "bbr-web-macos/testkit",
    "bbr-ui/rect-probes",
]
# Visual-evidence-only extension. GPUI's test-support feature changes executor
# and leak-detection behavior, so it must never leak into ordinary real-app
# E2E. Capture builds opt in explicitly while retaining the authenticated
# local testkit gateway.
visual-capture = [
    "testkit",
    "dep:image",
    "gpui/test-support",
    "gpui_platform/test-support",
]

[dependencies]
anyhow = "1"
async-signal = "0.2"
bbr-browser.workspace = true
bbr-command.workspace = true
bbr-domain.workspace = true
bbr-persistence.workspace = true
bbr-split.workspace = true
bbr-ui = { path = "../bbr-ui" }
bbr-web.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui_platform.workspace = true
log = "0.4"
smol.workspace = true

# Test-support crates (portable; only the gateway under `testkit`).
bbr-testkit = { workspace = true, optional = true }
# Visual-capture only: crop an element readback to its exact pixels (the
# same 0.25 crate GPUI's renderer readback returns).
image = { version = "0.25", optional = true }
# Blueprint D15: Chrome's bookmarks (JSON) and Safari's/Chrome's history
# (SQLite) for the first-run import; both crates are already in the
# workspace (the testkit wire format and the persistence store).
serde_json.workspace = true
rusqlite.workspace = true

# macOS: native WebKit engine + raw window handle to attach it to the GPUI
# root view. On other targets the app uses a portable null engine so the
# workspace still evaluates.
[target.'cfg(target_os = "macos")'.dependencies]
bbr-web-macos.workspace = true
mach2 = { version = "0.4", optional = true }
objc2.workspace = true
raw-window-handle.workspace = true

# Linux/FreeBSD: keep the workspace evaluating (GPUI-CE needs a platform
# backend to compile its platform layer; gpui_platform pulls gpui_linux).
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["wayland"] }

[dev-dependencies]
bbr-domain.workspace = true
bbr-fixtures.workspace = true
bbr-persistence.workspace = true
bbr-testkit.workspace = true
mach2 = "0.4"
image = "0.25"
serde.workspace = true
