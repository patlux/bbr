<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BBR Media</title>
    <script>
      // Blueprint D24 fixture: a silent 60-second looping audio track built
      // in the page (8 kHz, 8-bit mono WAV of the midpoint sample), started
      // on load. If autoplay with sound is refused, it plays muted. The
      // Media Session title comes from the `title` query parameter.
      function silentWav(seconds) {
        const rate = 8000;
        const samples = rate * seconds;
        const bytes = new Uint8Array(44 + samples);
        const view = new DataView(bytes.buffer);
        const text = (at, s) => [...s].forEach((c, i) => view.setUint8(at + i, c.charCodeAt(0)));
        text(0, "RIFF");
        view.setUint32(4, 36 + samples, true);
        text(8, "WAVE");
        text(12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, rate, true);
        view.setUint32(28, rate, true);
        view.setUint16(32, 1, true);
        view.setUint16(34, 8, true);
        text(36, "data");
        view.setUint32(40, samples, true);
        bytes.fill(128, 44);
        return URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
      }
      window.addEventListener("load", () => {
        const title = new URLSearchParams(location.search).get("title") || "Fixture Tone";
        if ("mediaSession" in navigator && window.MediaMetadata) {
          navigator.mediaSession.metadata = new MediaMetadata({ title, artist: "BBR Fixtures" });
        }
        const audio = document.getElementById("track");
        audio.src = silentWav(60);
        audio.loop = true;
        audio.play().catch(() => {
          audio.muted = true;
          audio.play().catch(() => {});
        });
        // BBR's probe lives in its own content world: if its state ever
        // showed up in this page's world, the title would say so.
        setInterval(() => {
          if ("__bbrMedia" in window) {
            document.title = "BBR Media leaked";
          }
        }, 100);
      });
    </script>
  </head>
  <body>
    <main>
      <h1>Media</h1>
      <audio id="track"></audio>
    </main>
  </body>
</html>
