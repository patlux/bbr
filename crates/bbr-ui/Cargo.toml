# bbr-ui joins the root workspace as a path dependency of `bbr-app` during
# the G1a cutover; the Orchestrator's serial patch adds `crates/bbr-ui` to the
# root `members` array (this crate then participates in the workspace gates
# and shares one resolution/type world with `bbr-app`).

[package]
name = "bbr-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "BBR portable presentation crate: Chassis design tokens (Theme/Palette/Density), the §15 state vocabulary, and plain (Model, Theme, Callbacks) components. Exact direct dependencies: gpui + bbr-domain only."

[dependencies]
# GPUI-CE at the exact upstream commit the workspace pins (see the root
# [workspace.dependencies] + [patch.crates-io]); `default-features = false`
# with `font-kit` matches the `gpui` workspace entry exactly so the whole
# workspace resolves one gpui type world. This crate never needs
# `gpui_platform` (no Application) or `gpui-component`.
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "568271c01c5a9d640d7b091e5bfd136b04035f28", default-features = false, features = ["font-kit"] }
# The single hue/appearance authority: `ProfileHue`, `SpaceTheme`, `SpaceId`.
# The only permitted first-party transitive edge is the existing
# bbr-domain -> bbr-web ProfileId path; bbr-ui never declares or imports
# bbr-web itself (the dependency-audit gate enforces this).
bbr-domain = { path = "../bbr-domain" }
