[package]
name = "bbr-web-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WKWebView + AppKit bridge for BBR (macOS only; empty crate on other targets)."

[dependencies]
bbr-web.workspace = true
log = "0.4"

# raw-window-handle must match gpui 0.2.2 (0.6.x) so the AppKitWindowHandle
# we extract from the GPUI root view is the same type the bridge consumes.
raw-window-handle.workspace = true

# All native dependencies are macOS-only so the workspace still evaluates on
# Linux (the crate body is #[cfg(target_os = "macos")] gated too).
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2.workspace = true

# objc2-foundation: NSUUID (deterministic data-store ids), NSString, NSURL,
# NSURLRequest, NSError, NSGeometry (NSRect), and the core-foundation CG types.
objc2-foundation = { workspace = true, features = [
    "NSString",
    "NSURL",
    "NSURLRequest",
    "NSError",
    "NSUUID",
    "NSGeometry",
    "NSObject",
    "NSKeyValueObserving",
    # Downloads: NSProgress (WKDownload progress KVO), NSFileManager
    # (default download folder, file existence for suggested-destination
    # uniquification and reveal eligibility), NSPathUtilities
    # (NSDownloadsDirectory constant), NSURLResponse (the destination
    # decision callback's declared content length), NSData (cancel resume
    # data). NSProgress/NSURLResponse/NSData are also enabled transitively by
    # objc2-web-kit's WKDownload/WKDownloadDelegate; NSFileManager and
    # NSPathUtilities are direct.
    "NSProgress",
    "NSFileManager",
    "NSPathUtilities",
    "NSURLResponse",
    "NSData",
    "objc2-core-foundation",
    "std",
] }

# objc2-app-kit: NSView, NSWindow, NSApplication, NSResponder, NSEvent.
# NSGeometry/CG types come transitively via these features (see how the
# workspace's objc2-foundation enables `NSGeometry` + `objc2-core-foundation`).
objc2-app-kit = { workspace = true, features = [
    "NSApplication",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSEvent",
    # Window-geometry persist source (Phase 7 warm-restore): the
    # window-content measurement flips the AppKit screen rect into GPUI
    # top-left coordinates using the screen frame (GPUI's `bounds()` space).
    "NSScreen",
    # Downloads: NSWorkspace for Reveal-in-Finder
    # (activateFileViewerSelectingURLs:).
    "NSWorkspace",
    # Context menu: NSPasteboard for the Copy Link entry (the BBR-owned
    # context menu's copy writes the page URL to the general pasteboard),
    # NSMenu/NSMenuItem for the WebKit page-menu classification (the
    # `NSMenuWillOpenNotification` observer inspects the item titles), and
    # block2 for the local right-click event monitor handler.
    "NSPasteboard",
    "NSMenu",
    "NSMenuItem",
    "block2",
] }

# objc2-core-foundation: CFBundle (the main-bundle identifier for the
# default-browser claim) and CFString (the scheme strings passed to
# LSSetDefaultHandlerForURLScheme). Already resolved in the lockfile via
# objc2-foundation/objc2-web-kit; a direct dependency only adds the two
# feature-gated CF types, no new crate.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "CFBundle",
    "CFString",
    "std",
] }

# objc2-web-kit: WKWebView + configuration + delegates + data store.
# `objc2-app-kit` is a feature of objc2-web-kit that gates the delegate
# protocol method definitions (they reference NSView/NSWindow).
objc2-web-kit = { workspace = true, features = [
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
    "WKNavigation",
    "WKNavigationDelegate",
    "WKNavigationAction",
    "WKUIDelegate",
    "WKWindowFeatures",
    "WKPreferences",
    "WKProcessPool",
    "WKContentWorld",
    "WKFrameInfo",
    # Downloads: WKDownload + WKDownloadDelegate (the modern WebKit download
    # lifecycle: destination decision, progress via NSProgress, finish,
    # fail-with-resume-data, cancel).
    "WKDownload",
    "WKDownloadDelegate",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "std",
] }