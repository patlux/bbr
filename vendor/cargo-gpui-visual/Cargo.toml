[package]
name = "cargo-gpui-visual"
version = "0.1.1"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Exact GPUI snapshot comparison and local visual review, without a server"

# Independent root: the portable CLI never resolves or builds GPUI.
[workspace]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
# Lossless WebP reference encoding only (vendored libwebp 1.6.0, static, via cc).
# Decoding stays pure Rust (image-webp through `image`).
libwebp-sys = { version = "0.14.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
toml = "0.8.23"
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
signal-hook = { version = "0.3.18", default-features = false }

# The CLI decodes, hashes, compares and encodes thousands of full-size references
# even in dev builds (the default of `cargo run`): optimize every dependency
# (codecs, SHA-256), not this crate. Consumers' own roots set their own profiles.
[profile.dev.package."*"]
opt-level = 3
