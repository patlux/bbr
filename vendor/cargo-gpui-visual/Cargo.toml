[package]
name = "cargo-gpui-visual"
version = "0.1.1"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Exact GPUI snapshot comparison and local visual review, without a server"

# Independent root: the portable CLI never resolves or builds GPUI.
[workspace]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
toml = "0.8.23"

[dev-dependencies]
tempfile = "3.27.0"
