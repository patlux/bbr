[package]
name = "bbr-visual"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

# Consumer tooling is deliberately separate from BBR's production Cargo graph.
[workspace]

[dependencies]
cargo-gpui-visual = { path = "../../vendor/cargo-gpui-visual" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8.23"
sha2 = "0.10.9"
image = { version = "0.25.10", default-features = false, features = ["png"] }
signal-hook = { version = "0.3.18", default-features = false }
libc = "0.2.189"
tempfile = "3.27.0"

# Optimize portable codecs/hashers, without changing the product build profile.
[profile.dev.package."*"]
opt-level = 3
